<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1B3B5A">
<title>Способы покупки — ЖК Алеа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600;700&family=Prosto+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=10">
<style>
  :root { --alea-dark: #1B3B5A; --alea-mid: #2A5878; }
  body { background: #F5F7FA; }

  .subpage-hero {
    background-color: var(--alea-dark);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    min-height: 220px;
    background-size: cover;
    background-position: center;
    margin-bottom: 16px;
  }
  .subpage-hero__title {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 16px 20px 20px;
    background: linear-gradient(to top, rgba(27,59,90,.7) 0%, transparent 100%);
    font-family: 'Montserrat', sans-serif;
    font-size: 22px;
    font-weight: 800;
    text-transform: uppercase;
    color: #fff;
    letter-spacing: .04em;
    margin: 0;
    line-height: 1.2;
  }
  .subpage-hero__title em {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 26px;
    display: block;
    letter-spacing: .02em;
  }

  .alea-info-card {
    background: linear-gradient(135deg, var(--alea-dark) 0%, var(--alea-mid) 100%);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 14px;
    color: #fff;
  }
  .alea-info-card__label {
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 500;
    opacity: .7;
    text-transform: uppercase;
    letter-spacing: .07em;
    margin-bottom: 6px;
  }
  .alea-info-card__value {
    font-family: 'Montserrat', sans-serif;
    font-size: 22px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  .btn-calc {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border: 2px solid var(--alea-dark);
    color: var(--alea-dark);
    border-radius: 14px;
    padding: 16px 20px;
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 14px;
  }

  .alea-contacts {
    background: #fff;
    border-radius: 20px;
    padding: 24px 20px 20px;
    margin-top: 28px;
  }
  .alea-contacts__title {
    font-family: 'Montserrat', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--alea-dark);
    margin: 0 0 16px;
  }
  .alea-contact {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #F0F4F8;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    text-decoration: none;
    color: var(--alea-dark);
  }
  .alea-contact__name {
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #5C7A96;
  }
  .alea-contact__number {
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--alea-dark);
  }
</style>
</head>
<body>
<div class="page">

  <div class="back-row">
    <a href="alea" class="back-link" aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
  </div>

  <div class="subpage-hero" style="background-image:url('assets/img/alea-purchase.jpg')">
    <h2 class="subpage-hero__title">СПОСОБЫ<br><em>покупки:</em></h2>
  </div>

  <div class="alea-info-card">
    <div class="alea-info-card__label">Рассрочка:</div>
    <div class="alea-info-card__value">ПВ от 30%</div>
  </div>

  <a href="alea-calc" class="btn-calc">
    <span>Калькулятор рассрочки</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </a>

  <div class="page-footer-space"></div>

  <div class="alea-contacts">
    <h2 class="alea-contacts__title">Контакты</h2>
    <a href="tel:+79148755457" class="alea-contact">
      <span class="alea-contact__name">Арсений (руководитель ПО)</span>
      <span class="alea-contact__number">+7 914 875 54 57</span>
    </a>
    <a href="tel:+79786891366" class="alea-contact">
      <span class="alea-contact__name">Отдел продаж</span>
      <span class="alea-contact__number">+7 978 689 13 66</span>
    </a>
    <a href="tel:+79636916609" class="alea-contact">
      <span class="alea-contact__name">Валерия</span>
      <span class="alea-contact__number">+7 963 691 66 09</span>
    </a>
    <a href="tel:+79790771306" class="alea-contact">
      <span class="alea-contact__name">Алексей</span>
      <span class="alea-contact__number">+7 979 077 13 06</span>
    </a>
  </div>

  <div class="page-footer-space"></div>

</div>
</body>
</html>
