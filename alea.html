<link rel="stylesheet" href="assets/css/style.css?v=10">
<style>
  :root { --alea-dark: #1B3B5A; --alea-mid: #2A5878; }

  body.alea { background: #F5F7FA; }

  /* Hero */
  body.alea .hero__img {
    aspect-ratio: 840 / 644;
    background-size: cover;
    background-position: center;
    border-radius: 20px;
  }

  /* Title block */
  .alea-title-block { margin: 22px 0 20px; }
  .alea-title-script {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 30px;
    font-weight: 500;
    color: var(--alea-mid);
    margin: 0 0 4px;
    line-height: 1.1;
  }
  .alea-title-bold {
    font-family: 'Montserrat', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--alea-dark);
    text-transform: uppercase;
    letter-spacing: .04em;
    line-height: 1.2;
    margin: 0;
  }

  /* CTA */
  body.alea .btn-primary {
    background: linear-gradient(115deg, var(--alea-dark) 0%, var(--alea-mid) 100%);
    margin-bottom: 28px;
  }

  /* Section title */
  body.alea .section-title {
    color: var(--alea-dark);
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: .08em;
  }

  /* Menu */
  body.alea .menu__item {
    background: #fff;
    color: var(--alea-dark);
    border: 1.5px solid #E2ECF4;
    box-shadow: 0 2px 8px rgba(27,59,90,.06);
  }

  /* Contacts — light theme */
  .alea-contacts {
    background: #fff;
    border-radius: 20px;
    padding: 24px 20px 20px;
    margin-top: 28px;
  }
  .alea-contacts__title {
    font-family: 'Montserrat', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--alea-dark);
    margin: 0 0 16px;
  }
  .alea-contact {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #F0F4F8;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    text-decoration: none;
    color: var(--alea-dark);
  }
  .alea-contact__name {
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #5C7A96;
  }
  .alea-contact__number {
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--alea-dark);
  }
  .alea-contacts__social {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 16px;
  }
  .alea-contacts__social .social img {
    width: 36px;
    height: 36px;
    object-fit: contain;
  }
</style>
</head>
